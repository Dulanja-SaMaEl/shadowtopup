<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow Store Shell Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0b1d;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 20px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .card {
      background: #181534;
      border: 1px solid #2e1065;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      line-height: 1.4;
      word-break: break-all;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      display: block;
    }
    .status.error {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid #f43f5e;
      color: #fb7185;
      display: block;
    }
    .status.info {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      display: block;
    }
    .settings-toggle {
      text-align: center;
      margin-top: 12px;
    }
    .settings-link {
      font-size: 10px;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
      font-family: monospace;
    }
    .settings-link:hover { color: #e2e8f0; }
    .settings-panel {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #0f0d23;
      border: 1px solid #2e1065;
      border-radius: 8px;
    }
    .settings-panel.open { display: block; }
    .input-group {
      margin-bottom: 8px;
    }
    .input-label {
      font-size: 9px;
      color: #94a3b8;
      margin-bottom: 3px;
      display: block;
      text-transform: uppercase;
      font-weight: 700;
    }
    .input-field {
      width: 100%;
      background: #181534;
      border: 1px solid #3b0764;
      color: #fff;
      font-size: 10px;
      font-family: monospace;
      padding: 6px 8px;
      border-radius: 6px;
      outline: none;
    }
    .input-field:focus {
      border-color: #06b6d4;
    }
    .save-btn {
      width: 100%;
      background: #2e1065;
      color: #c084fc;
      border: 1px solid #7e22ce;
      padding: 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .save-btn:hover {
      background: #3b0764;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">SHADOW STORE SYNC</div>
      <div class="subtitle">Garena Shell Live Inventory Engine</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Target Server:</span>
      <span id="targetServerVal" class="val">shadowstorelk.com</span>
    </div>
    <div class="row">
      <span class="label">Primary Account:</span>
      <span id="primaryAccountVal" class="val">SHADOW_TOPUP1</span>
    </div>
  </div>

  <button id="syncBtn" class="btn">⚡ Sync Live Shells Now</button>

  <div id="statusBox" class="status"></div>

  <div class="settings-toggle">
    <span id="toggleSettings" class="settings-link">⚙️ Configure Sync Settings</span>
  </div>

  <div id="settingsPanel" class="settings-panel">
    <div class="input-group">
      <label class="input-label">Account Username</label>
      <input type="text" id="inputUsername" class="input-field" placeholder="SHADOW_TOPUP1" />
    </div>
    <div class="input-group">
      <label class="input-label">Shadow Store Sync Endpoint</label>
      <input type="text" id="inputApiUrl" class="input-field" placeholder="https://www.shadowstorelk.com/api/admin/shell-accounts/sync" />
    </div>
    <div class="input-group">
      <label class="input-label">Sync Secret Key</label>
      <input type="password" id="inputSyncSecret" class="input-field" placeholder="Enter sync secret" />
    </div>
    <button id="saveSettingsBtn" class="save-btn">Save to Extension Storage</button>
  </div>

  <script src="config.local.js"></script>
  <script src="popup.js"></script>
</body>
</html>
