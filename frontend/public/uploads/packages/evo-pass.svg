<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="evoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="evoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon -->
  <polygon points="60,10 105,32 105,88 60,110 15,88 15,32" fill="#180c10" stroke="url(#evoGrad)" stroke-width="4" filter="url(#evoGlow)"/>

  <!-- Inner Dark Hexagon -->
  <polygon points="60,20 95,38 95,82 60,100 25,82 25,38" fill="#2d0c15" opacity="0.9"/>

  <!-- Lightning Bolt (EVO Energy) -->
  <polygon points="64,25 42,62 58,62 50,95 78,52 62,52" fill="url(#evoGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Winged Flame Accents -->
  <path d="M30 60 Q40 45 46 52" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M90 60 Q80 45 74 52" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
